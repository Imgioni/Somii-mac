name: macOS build

# Builds the macOS VST3, Audio Unit, CLAP and standalone app (universal: Apple Silicon + Intel)
# and packages them, because the project is developed on Windows where none of that can be built.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # third_party/ is not in the repository (JUCE alone is ~165 MB), so fetch the same versions.
      - name: Fetch JUCE and clap-juce-extensions
        run: |
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE third_party/JUCE
          git clone https://github.com/free-audio/clap-juce-extensions third_party/clap-juce-extensions
          git -C third_party/clap-juce-extensions checkout 9fbefae3d9c3d130aafb558c1ec15427a4bd24be
          git -C third_party/clap-juce-extensions submodule update --init --recursive

      - name: Web UI syntax
        run: node tests/UiSyntaxTests.mjs

      - name: Install Ninja
        run: brew install ninja

      - name: Build
        run: bash scripts/build-mac.sh

      - name: DSP tests
        run: |
          ulimit -s 65532
          ./build-mac/SGTests_artefacts/Release/SGTests

      # Renders audio in memory; no audio device is required.
      - name: Plugin smoke test
        run: ./build-mac/SGPluginSmoke_artefacts/Release/SGPluginSmoke "build-mac/Geminus_artefacts/Release/VST3/Somii.vst3"

      # Apple's own Audio Unit validator. The plug-in is copied to ~/Library by the build.
      - name: auval
        run: auval -v aumu Gmns Spkr

      - name: Verify universal bundles
        run: bash scripts/verify-mac.sh

      - name: Package
        run: bash installer/mac/build_pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Somii-macOS
          path: dist/*macOS*
          if-no-files-found: error
